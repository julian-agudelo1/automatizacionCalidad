
serenity {
    take.screenshots = AFTER_EACH_STEP
    use.unique.browser = true
    test.root = co.com.udea.calidad.advantage
    console.colors = true

    report {
        accessibility = true
    }

    requirement {
        types = "epic, feature"
    }
}

webdriver {
    driver = chrome
    autodownload = true

    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
    }
}

chrome.switches = """
    --start-maximized;
    --disable-popup-blocking;
    --disable-infobars;
    --remote-allow-origins=*
"""

pages {
    advantageUrl = "https://www.advantageonlineshopping.com/"
}
